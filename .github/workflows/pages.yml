# 目的：リポジトリの site/ フォルダだけを GitHub Pages に公開する。
#
# 注意：
# - 公開するのは site/ の中身だけ。docs/（検証報告などを含む）やソースコードは公開しない。
# - 使う公式アクションはコミット SHA で固定する（タグの付け替えによる差し替えを防ぐ）。版を上げるときは確認して書き換える。
# - 権限は必要最小限（contents: read、pages・id-token の書き込みだけ）。
# - 公開を有効にするには、GitHub の Settings → Pages → Build and deployment の Source を「GitHub Actions」にする（依頼者の操作）。
# - 公開先: https://hiruta-cell.github.io/calender_add_app/

name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # GitHub の画面から手動で再公開できるようにする
  workflow_dispatch:

# 同時に2つ公開が走らないようにする（後の公開を優先し、途中の公開は待たせない）
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 公開に必要な権限だけをこのジョブに与える（pages の書き込みと、公開の本人確認用の id-token）
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # リポジトリを取得する。認証情報は後続の手順に残さない
      - name: リポジトリを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Pages の設定を準備
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # 公開するのは site/ の中だけ
      - name: 公開する内容を作成
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
